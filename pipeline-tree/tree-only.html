<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Specialist · 순수 계층 트리 뷰 (설명 없이 트리만)</title>
  <meta name="description" content="설명문 없이 순수한 함수 상하 의존성과 텐서 shape, 실행 스텝만 계층적으로 접고 펼쳐보는 클린 트리 뷰">
  <link rel="stylesheet" href="../assets/css/global-font.css">
  <style>
    :root {
      --bg: #090d16;
      --bg-surface: #0f172a;
      --bg-hover: #1e293b;
      --border: #1e293b;
      --border-focus: #3b82f6;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --blue: #38bdf8;
      --blue-subtle: rgba(56, 189, 248, 0.12);
      --green: #34d399;
      --green-subtle: rgba(52, 211, 153, 0.12);
      --red: #f43f5e;
      --red-subtle: rgba(244, 63, 94, 0.15);
      --purple: #c084fc;
      --yellow: #fbbf24;
      --line: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text-main);
      font-family: Consolas, "Courier New", "Malgun Gothic", monospace;
      line-height: 1.5;
    }

    /* Top Control Bar */
    header.pure-topbar {
      padding: 12px 24px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-title {
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--blue);
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .pure-pill {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--blue-subtle);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--blue);
      font-weight: 700;
    }

    /* Subject Tabs */
    .subj-nav {
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }
    .subj-btn {
      padding: 6px 12px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .subj-btn:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }
    .subj-btn.active {
      background: var(--blue-subtle);
      border-color: var(--blue);
      color: var(--blue);
    }

    /* Controls */
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .search-box {
      padding: 6px 10px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-main);
      font: inherit;
      font-size: 0.82rem;
      outline: none;
      min-width: 170px;
    }
    .search-box:focus {
      border-color: var(--blue);
    }
    .ctrl-btn {
      padding: 6px 11px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg-hover);
      color: var(--text-main);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .ctrl-btn:hover {
      border-color: var(--text-muted);
    }
    .ctrl-btn.active {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }
    .ctrl-btn.link-btn {
      background: transparent;
      border-color: rgba(148, 163, 184, 0.3);
      color: var(--text-muted);
      text-decoration: none;
    }
    .ctrl-btn.link-btn:hover {
      color: var(--text-main);
      border-color: var(--text-main);
    }

    /* Pure Tree Canvas */
    main.pure-canvas {
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Tree Details & Summary */
    details.pure-tree-root {
      margin-bottom: 20px;
    }
    summary.pure-summary {
      list-style: none;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      transition: background 0.12s;
    }
    summary.pure-summary::-webkit-details-marker {
      display: none;
    }
    summary.pure-summary:hover {
      background: var(--bg-hover);
    }
    .toggle-arrow {
      color: var(--text-muted);
      font-size: 0.8rem;
      display: inline-block;
      transition: transform 0.15s ease;
      width: 14px;
      text-align: center;
    }
    details[open] > summary > .toggle-arrow {
      transform: rotate(90deg);
      color: var(--blue);
    }

    /* Node Styles */
    .root-tag {
      background: #1e3a8a;
      color: #93c5fd;
      padding: 2px 7px;
      border-radius: 5px;
      font-weight: 900;
      font-size: 0.78rem;
    }
    .root-text {
      color: #e0e7ff;
      font-weight: 800;
      font-size: 1rem;
    }

    /* Tree Branches */
    .branch-group {
      margin-left: 20px;
      padding-left: 14px;
      border-left: 1px dashed var(--line);
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 6px;
    }
    .branch-summary {
      font-size: 0.94rem;
      font-weight: 800;
      color: var(--yellow);
    }
    .branch-nodes {
      margin-left: 20px;
      padding-left: 14px;
      border-left: 1px dashed var(--line);
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }

    /* Function Nodes */
    details.func-item {
      border-radius: 6px;
      transition: background 0.12s;
    }
    details.func-item.exam-hit {
      background: var(--red-subtle);
      border: 1px solid rgba(244, 63, 94, 0.35);
    }
    .func-summary {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .func-tag {
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--bg-hover);
      color: var(--text-muted);
    }
    .func-tag.exam {
      background: var(--red);
      color: #fff;
      font-weight: 900;
    }
    .func-name {
      color: var(--blue);
      font-weight: 800;
    }
    .func-shapes {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-left: auto;
      display: flex;
      gap: 6px;
    }
    .shape-in { color: #94a3b8; }
    .shape-out { color: var(--green); font-weight: 700; }

    /* Steps / Lines inside Function */
    .func-steps {
      margin-left: 28px;
      padding-left: 12px;
      border-left: 1px dashed var(--line);
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-top: 4px;
      padding-bottom: 6px;
      font-size: 0.82rem;
    }
    .step-line {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      color: #cbd5e1;
    }
    .step-line.comment {
      color: #64748b;
      font-style: italic;
    }
    .step-line.code-highlight {
      color: #38bdf8;
      font-weight: 700;
    }
    .step-bullet {
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    /* Toast */
    .pure-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 10px 16px;
      border-radius: 8px;
      background: var(--green);
      color: #052e16;
      font-weight: 800;
      font-size: 0.84rem;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      pointer-events: none;
    }
    .pure-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 800px) {
      header.pure-topbar { padding: 10px 14px; }
      .search-box { width: 100%; }
      .func-shapes { margin-left: 0; width: 100%; }
    }
  </style>
</head>
<body>

  <header class="pure-topbar">
    <div class="topbar-left">
      <a class="brand-title" href="../">
        <span>🌳 순수 계층 트리</span>
        <span class="pure-pill">설명 없이 트리만</span>
      </a>
      <nav class="subj-nav" aria-label="과목 탭">
        <button class="subj-btn active" data-subject="llm" type="button">01 · LLM</button>
        <button class="subj-btn" data-subject="rag" type="button">02 · RAG</button>
        <button class="subj-btn" data-subject="data" type="button">03 · DATA</button>
        <button class="subj-btn" data-subject="vision" type="button">04 · VISION</button>
        <button class="subj-btn" data-subject="on-device" type="button">05 · ON-DEVICE</button>
      </nav>
    </div>

    <div class="topbar-right">
      <input type="text" id="pureSearch" class="search-box" placeholder="🔍 함수 / 텐서 검색..." />
      <button id="btnPureExpand" class="ctrl-btn" type="button">모두 펼치기</button>
      <button id="btnPureCollapse" class="ctrl-btn" type="button">모두 접기</button>
      <button id="btnPureBranch" class="ctrl-btn" type="button">브랜치만</button>
      <button id="btnPureExam" class="ctrl-btn" type="button">🔥 기출만</button>
      <button id="btnPureCopy" class="ctrl-btn" type="button">📋 전체 복사</button>
      <a href="index.html" class="ctrl-btn link-btn">📖 설명 포함 뷰로</a>
    </div>
  </header>

  <main class="pure-canvas" id="pureCanvas">
    <!-- Generated dynamically -->
  </main>

  <div id="pureToast" class="pure-toast">전체 트리 텍스트가 복사되었습니다!</div>

  <script src="../assets/js/pipeline-tree-data.js"></script>
  <script>
    (() => {
      const $ = s => document.querySelector(s);
      const $$ = s => document.querySelectorAll(s);

      let currentSubj = 'llm';
      let examOnly = false;
      const dataset = window.PIPELINE_TREE_DATA || {};

      function init() {
        const params = new URLSearchParams(window.location.search);
        const subj = params.get('subject')?.toLowerCase();
        if (subj && dataset[subj]) currentSubj = subj;

        $$('.subj-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.subject === currentSubj);
          btn.addEventListener('click', () => switchSubject(btn.dataset.subject));
        });

        $('#btnPureExpand')?.addEventListener('click', () => setAllDetails(true));
        $('#btnPureCollapse')?.addEventListener('click', () => setAllDetails(false));
        $('#btnPureBranch')?.addEventListener('click', showBranchOnly);
        $('#btnPureExam')?.addEventListener('click', toggleExamFilter);
        $('#btnPureCopy')?.addEventListener('click', copyTree);
        $('#pureSearch')?.addEventListener('input', e => handleSearch(e.target.value));

        renderTree();
      }

      function switchSubject(subj) {
        if (!dataset[subj]) return;
        currentSubj = subj;
        $$('.subj-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.subject === subj));
        const url = new URL(window.location);
        url.searchParams.set('subject', subj);
        window.history.replaceState({}, '', url);
        renderTree();
      }

      function renderTree() {
        const data = dataset[currentSubj];
        const canvas = $('#pureCanvas');
        if (!data || !canvas) return;

        let branchesHtml = (data.branches || []).map((b, bIdx) => {
          let nodesHtml = (b.nodes || []).map((n, nIdx) => {
            let stepsHtml = (n.steps || []).map(st => {
              const isComment = st.trim().startsWith('#');
              const isHighlight = st.includes('calc_loss_batch') || st.includes('cross_entropy') || st.includes('keys.view') || st.includes('transpose') || st.includes('argmax') || st.includes('cat');
              return `<div class="step-line ${isComment ? 'comment' : isHighlight ? 'code-highlight' : ''}">
                <span class="step-bullet">├─</span>
                <span>${esc(st)}</span>
              </div>`;
            }).join('');

            return `
              <details class="func-item ${n.isExam ? 'exam-hit' : ''}" open data-node-index="${nIdx}">
                <summary class="pure-summary func-summary">
                  <span class="toggle-arrow">▶</span>
                  <span class="func-tag ${n.isExam ? 'exam' : ''}">${esc(n.kind)}</span>
                  <span class="func-name">${esc(n.name)}</span>
                  <div class="func-shapes">
                    <span class="shape-in">[In: ${esc(n.inShape)}]</span>
                    <span class="shape-out">➔ [Out: ${esc(n.outShape)}]</span>
                  </div>
                </summary>
                <div class="func-steps">
                  ${stepsHtml}
                </div>
              </details>`;
          }).join('');

          return `
            <details class="branch-item" open data-branch-index="${bIdx}">
              <summary class="pure-summary branch-summary">
                <span class="toggle-arrow">▶</span>
                <span>${b.icon || '📂'} ${esc(b.title)}</span>
              </summary>
              <div class="branch-nodes">
                ${nodesHtml}
              </div>
            </details>`;
        }).join('');

        canvas.innerHTML = `
          <details class="pure-tree-root" open>
            <summary class="pure-summary">
              <span class="toggle-arrow">▶</span>
              <span class="root-tag">ROOT TARGET</span>
              <span class="root-text">${esc(data.root?.title || data.title)}</span>
            </summary>
            <div class="branch-group">
              ${branchesHtml}
            </div>
          </details>`;

        if (examOnly) applyExamFilter();
      }

      function setAllDetails(isOpen) {
        $$('#pureCanvas details').forEach(d => d.open = isOpen);
      }

      function showBranchOnly() {
        $$('#pureCanvas .pure-tree-root').forEach(d => d.open = true);
        $$('#pureCanvas .branch-item').forEach(d => d.open = true);
        $$('#pureCanvas .func-item').forEach(d => d.open = false);
      }

      function toggleExamFilter() {
        examOnly = !examOnly;
        $('#btnPureExam')?.classList.toggle('active', examOnly);
        applyExamFilter();
      }

      function applyExamFilter() {
        $$('.func-item').forEach(item => {
          if (examOnly) {
            item.style.display = item.classList.contains('exam-hit') ? '' : 'none';
          } else {
            item.style.display = '';
          }
        });
      }

      function handleSearch(q) {
        const keyword = q.toLowerCase().trim();
        $$('.func-item').forEach(item => {
          const text = item.textContent.toLowerCase();
          const match = !keyword || text.includes(keyword);
          item.style.display = match ? '' : 'none';
          if (keyword && match) {
            item.open = true;
            item.closest('.branch-item')?.setAttribute('open', '');
          }
        });
      }

      function copyTree() {
        const data = dataset[currentSubj];
        if (!data?.ascii) return;
        navigator.clipboard.writeText(data.ascii).then(() => {
          const toast = $('#pureToast');
          if (toast) {
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
          }
        });
      }

      function esc(v) {
        return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      }

      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
