<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Specialist · 순수 계층 트리 뷰 (최상위 함수 탑다운)</title>
  <meta name="description" content="설명문 없이 최상위 실행 함수부터 하위 호출 함수 및 텐서 변환으로 뻗어나가는 진짜 Top-Down 계층 트리">
  <link rel="stylesheet" href="../assets/css/global-font.css">
  <style>
    :root {
      --bg: #090d16;
      --bg-surface: #0f172a;
      --bg-hover: #1e293b;
      --border: #1e293b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --blue: #38bdf8;
      --blue-subtle: rgba(56, 189, 248, 0.12);
      --green: #34d399;
      --red: #f43f5e;
      --red-subtle: rgba(244, 63, 94, 0.15);
      --yellow: #fbbf24;
      --line: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text-main);
      font-family: Consolas, "Courier New", "Malgun Gothic", monospace;
      line-height: 1.5;
    }

    /* Top Control Bar */
    header.pure-topbar {
      padding: 12px 24px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-title {
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--blue);
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .pure-pill {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--blue-subtle);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--blue);
      font-weight: 700;
    }

    /* Subject Tabs */
    .subj-nav {
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }
    .subj-btn {
      padding: 6px 12px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .subj-btn:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }
    .subj-btn.active {
      background: var(--blue-subtle);
      border-color: var(--blue);
      color: var(--blue);
    }

    /* Controls */
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .search-box {
      padding: 6px 10px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-main);
      font: inherit;
      font-size: 0.82rem;
      outline: none;
      min-width: 170px;
    }
    .search-box:focus {
      border-color: var(--blue);
    }
    .ctrl-btn {
      padding: 6px 11px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg-hover);
      color: var(--text-main);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .ctrl-btn:hover {
      border-color: var(--text-muted);
    }
    .ctrl-btn.active {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }
    .ctrl-btn.link-btn {
      background: transparent;
      border-color: rgba(148, 163, 184, 0.3);
      color: var(--text-muted);
      text-decoration: none;
    }
    .ctrl-btn.link-btn:hover {
      color: var(--text-main);
      border-color: var(--text-main);
    }

    /* Pure Tree Canvas */
    main.pure-canvas {
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Top Goal Banner */
    .top-target-card {
      margin-bottom: 20px;
      padding: 14px 18px;
      border: 1px solid #1e3a8a;
      background: linear-gradient(180deg, #0f1f3d 0%, #091326 100%);
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .top-target-card h3 {
      margin: 0 0 4px;
      font-size: 0.95rem;
      color: #93c5fd;
    }
    .top-target-card p {
      margin: 0;
      color: #38bdf8;
      font-size: 0.85rem;
      font-weight: 700;
    }

    /* Nested Details Tree Node */
    details.tree-node {
      margin: 4px 0;
      border-radius: 6px;
      transition: background 0.12s;
    }
    details.tree-node.exam-hit > summary {
      background: rgba(244, 63, 94, 0.1);
      border-left: 3px solid var(--red);
    }
    summary.tree-summary {
      list-style: none;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      transition: background 0.12s;
      flex-wrap: wrap;
    }
    summary.tree-summary::-webkit-details-marker {
      display: none;
    }
    summary.tree-summary:hover {
      background: var(--bg-hover);
    }
    .toggle-arrow {
      color: var(--text-muted);
      font-size: 0.8rem;
      display: inline-block;
      transition: transform 0.15s ease;
      width: 14px;
      text-align: center;
    }
    details[open] > summary > .toggle-arrow {
      transform: rotate(90deg);
      color: var(--blue);
    }

    /* Node Tags */
    .node-tag {
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--bg-surface);
      color: #cbd5e1;
      border: 1px solid var(--border);
    }
    .node-tag.exam {
      background: var(--red);
      color: #fff;
      font-weight: 900;
      border-color: var(--red);
      box-shadow: 0 1px 4px rgba(244, 63, 94, 0.4);
    }
    .node-title {
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.88rem;
    }
    details.level-0 > summary > .node-title {
      font-size: 1rem;
      font-weight: 900;
      color: var(--yellow);
    }
    details.level-1 > summary > .node-title {
      font-size: 0.92rem;
      color: var(--blue);
    }

    /* Shapes */
    .node-shapes {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-left: auto;
      display: flex;
      gap: 6px;
    }
    .shape-in { color: #94a3b8; }
    .shape-out { color: var(--green); font-weight: 700; }

    /* Children Indentation & Lines */
    .tree-children {
      margin-left: 20px;
      padding-left: 14px;
      border-left: 1px dashed var(--line);
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 2px;
      margin-bottom: 4px;
    }

    /* Toast */
    .pure-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 10px 16px;
      border-radius: 8px;
      background: var(--green);
      color: #052e16;
      font-weight: 800;
      font-size: 0.84rem;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      pointer-events: none;
    }
    .pure-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 800px) {
      header.pure-topbar { padding: 10px 14px; }
      .search-box { width: 100%; }
      .node-shapes { margin-left: 0; width: 100%; }
    }
  </style>
</head>
<body>

  <header class="pure-topbar">
    <div class="topbar-left">
      <a class="brand-title" href="../">
        <span>🌳 최상위 탑다운 트리</span>
        <span class="pure-pill">호출 계층 구조</span>
      </a>
      <nav class="subj-nav" aria-label="과목 탭">
        <button class="subj-btn active" data-subject="llm" type="button">01 · LLM</button>
        <button class="subj-btn" data-subject="rag" type="button">02 · RAG</button>
        <button class="subj-btn" data-subject="data" type="button">03 · DATA</button>
        <button class="subj-btn" data-subject="vision" type="button">04 · VISION</button>
        <button class="subj-btn" data-subject="on-device" type="button">05 · ON-DEVICE</button>
      </nav>
    </div>

    <div class="topbar-right">
      <input type="text" id="pureSearch" class="search-box" placeholder="🔍 함수 / 텐서 검색..." />
      <button id="btnPureExpand" class="ctrl-btn" type="button">모두 펼치기</button>
      <button id="btnPureCollapse" class="ctrl-btn" type="button">모두 접기</button>
      <button id="btnPureLevel1" class="ctrl-btn" type="button">진입점만</button>
      <button id="btnPureExam" class="ctrl-btn" type="button">🔥 기출만</button>
      <button id="btnPureCopy" class="ctrl-btn" type="button">📋 전체 복사</button>
      <a href="index.html" class="ctrl-btn link-btn">📖 설명 포함 뷰로</a>
    </div>
  </header>

  <main class="pure-canvas" id="pureCanvas">
    <!-- Generated dynamically -->
  </main>

  <div id="pureToast" class="pure-toast">전체 트리 텍스트가 복사되었습니다!</div>

  <script src="../assets/js/pipeline-tree-data.js"></script>
  <script>
    (() => {
      const $ = s => document.querySelector(s);
      const $$ = s => document.querySelectorAll(s);

      let currentSubj = 'llm';
      let examOnly = false;
      const dataset = window.PIPELINE_TREE_DATA || {};

      function init() {
        const params = new URLSearchParams(window.location.search);
        const subj = params.get('subject')?.toLowerCase();
        if (subj && dataset[subj]) currentSubj = subj;

        $$('.subj-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.subject === currentSubj);
          btn.addEventListener('click', () => switchSubject(btn.dataset.subject));
        });

        $('#btnPureExpand')?.addEventListener('click', () => setAllDetails(true));
        $('#btnPureCollapse')?.addEventListener('click', () => setAllDetails(false));
        $('#btnPureLevel1')?.addEventListener('click', showLevel0Only);
        $('#btnPureExam')?.addEventListener('click', toggleExamFilter);
        $('#btnPureCopy')?.addEventListener('click', copyTree);
        $('#pureSearch')?.addEventListener('input', e => handleSearch(e.target.value));

        renderTree();
      }

      function switchSubject(subj) {
        if (!dataset[subj]) return;
        currentSubj = subj;
        $$('.subj-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.subject === subj));
        const url = new URL(window.location);
        url.searchParams.set('subject', subj);
        window.history.replaceState({}, '', url);
        renderTree();
      }

      function renderNode(node, level = 0) {
        const hasChildren = node.children && node.children.length > 0;
        let childrenHtml = '';
        if (hasChildren) {
          childrenHtml = `
            <div class="tree-children">
              ${node.children.map(child => renderNode(child, level + 1)).join('')}
            </div>
          `;
        }

        let shapesHtml = '';
        if (node.inShape || node.outShape) {
          shapesHtml = `
            <div class="node-shapes">
              ${node.inShape ? `<span class="shape-in">[In: ${esc(node.inShape)}]</span>` : ''}
              ${node.outShape ? `<span class="shape-out">➔ [Out: ${esc(node.outShape)}]</span>` : ''}
            </div>
          `;
        }

        return `
          <details class="tree-node level-${level} ${node.isExam ? 'exam-hit' : ''}" open>
            <summary class="tree-summary">
              <span class="toggle-arrow">${hasChildren ? '▶' : '•'}</span>
              ${node.kind ? `<span class="node-tag ${node.isExam ? 'exam' : ''}">${esc(node.kind)}</span>` : ''}
              <span class="node-title">${esc(node.name)}</span>
              ${shapesHtml}
            </summary>
            ${childrenHtml}
          </details>
        `;
      }

      function renderTree() {
        const data = dataset[currentSubj];
        const canvas = $('#pureCanvas');
        if (!data || !canvas) return;

        const trees = data.top_down_trees || [];
        const treeNodesHtml = trees.map(t => renderNode(t, 0)).join('');

        canvas.innerHTML = `
          <div class="top-target-card">
            <h3>🎯 ${esc(data.root?.title || '최상위 실행 목표')}</h3>
            <p>${esc(data.root?.methods || '')}</p>
          </div>
          <div class="top-down-container">
            ${treeNodesHtml}
          </div>
        `;

        if (examOnly) applyExamFilter();
      }

      function setAllDetails(isOpen) {
        $$('#pureCanvas details').forEach(d => d.open = isOpen);
      }

      function showLevel0Only() {
        $$('#pureCanvas details.level-0').forEach(d => d.open = true);
        $$('#pureCanvas details.tree-node:not(.level-0)').forEach(d => d.open = false);
      }

      function toggleExamFilter() {
        examOnly = !examOnly;
        $('#btnPureExam')?.classList.toggle('active', examOnly);
        applyExamFilter();
      }

      function applyExamFilter() {
        $$('.tree-node').forEach(item => {
          if (examOnly) {
            item.style.display = item.classList.contains('exam-hit') ? '' : 'none';
          } else {
            item.style.display = '';
          }
        });
      }

      function handleSearch(q) {
        const keyword = q.toLowerCase().trim();
        $$('.tree-node').forEach(item => {
          const text = item.textContent.toLowerCase();
          const match = !keyword || text.includes(keyword);
          item.style.display = match ? '' : 'none';
          if (keyword && match) {
            item.open = true;
            let parent = item.parentElement?.closest('details');
            while (parent) {
              parent.open = true;
              parent = parent.parentElement?.closest('details');
            }
          }
        });
      }

      function copyTree() {
        const data = dataset[currentSubj];
        if (!data?.ascii) return;
        navigator.clipboard.writeText(data.ascii).then(() => {
          const toast = $('#pureToast');
          if (toast) {
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
          }
        });
      }

      function esc(v) {
        return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      }

      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
